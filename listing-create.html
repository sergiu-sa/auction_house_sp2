<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Create Listing - List Your Item for Auction | Aucto</title>
    <meta
      name="title"
      content="Create Listing - List Your Item for Auction | Aucto"
    />
    <meta
      name="description"
      content="Create a new auction listing on Aucto. Upload images, set your deadline, and start receiving bids on your item."
    />
    <meta
      name="keywords"
      content="create listing, sell item, new auction, list product, seller tools"
    />
    <meta name="author" content="Aucto" />
    <meta name="robots" content="noindex, follow" />
    <link
      rel="canonical"
      href="https://auctohouse.netlify.app/listing-create.html"
    />

    <!-- Additional SEO -->
    <meta name="theme-color" content="#1e293b" />

    <!-- Display faces, self-hosted and same-origin.
         The stylesheet declaring them is render-blocking, so without a preload
         the request cannot start until that CSS has parsed.
         crossorigin is required even same-origin: fonts load in CORS mode.
         Only the latin faces: preloading latin-ext would defeat its unicode-range. -->
    <link
      rel="preload"
      href="/fonts/cormorant-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/source-sans-3-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Tailwind CSS -->
    <link rel="preload" href="/src/styles/main.css" as="style" />
    <link rel="stylesheet" href="/src/styles/main.css" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/images/icon_only_v2.svg" />
  </head>
  <body class="bg-aucto-bg antialiased" data-page-type="user-content">
    <!-- Skip Navigation Link -->
    <a
      href="#main-content"
      class="absolute -top-10 left-0 z-[100] bg-slate-900 px-4 py-2 text-sm font-bold text-white no-underline focus:top-0 focus:outline focus:outline-[3px] focus:outline-offset-2 focus:outline-aucto-red"
      style="border: 3px solid var(--aucto-border-dark)"
      >Skip to main content</a
    >

    <!-- Header (rendered by JavaScript) -->
    <header id="header"></header>

    <!-- Main Content -->
    <main
      id="main-content"
      tabindex="-1"
      class="mx-auto max-w-7xl px-6 py-8 md:px-8"
    >
      <!-- Breadcrumbs (rendered by JavaScript) -->
      <div id="breadcrumb-nav" class="mb-6"></div>

      <!-- Create form will be rendered by JavaScript -->
      <div id="create-listing-content"></div>
    </main>

    <!-- Footer (rendered by JavaScript) -->
    <div id="footer"></div>

    <!-- Import main script -->
    <script type="module" src="/src/pages/ListingCreate.ts"></script>
  </body>
</html>
