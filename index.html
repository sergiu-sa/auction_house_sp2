<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aucto - Online Auction House</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/images/icon_only.svg" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body class="antialiased bg-aucto-bg">
    <!-- Header (rendered by JavaScript) -->
    <div id="header"></div>

    <!-- Main Content -->
    <main class="px-6 py-8 mx-auto max-w-7xl md:px-8">
      <!-- Page Title & Filters -->
      <div class="mb-8">
        <h1
          class="mb-2 font-serif text-4xl font-bold text-slate-900 md:text-5xl"
        >
          Browse Auctions
        </h1>
        <p class="mb-6 text-slate-600">
          Discover unique items and place your bids
        </p>

        <!-- Filters & Sort -->
        <div
          class="flex flex-col items-start justify-between gap-4 md:flex-row md:items-center"
        >
          <!-- Status Filters -->
          <div class="flex flex-wrap gap-2">
            <button
              data-status-filter="all"
              class="px-4 py-2 text-sm font-medium text-white transition-colors border-2 border-slate-900 bg-slate-900"
            >
              All Auctions
            </button>
            <button
              data-status-filter="active"
              class="px-4 py-2 text-sm font-medium transition-colors border-2 border-slate-900 hover:bg-slate-50"
            >
              Active
            </button>
            <button
              data-status-filter="ended"
              class="px-4 py-2 text-sm font-medium transition-colors border-2 border-slate-900 hover:bg-slate-50"
            >
              Ended
            </button>
          </div>

          <!-- Sort & Clear -->
          <div class="flex items-center w-full gap-2 md:w-auto">
            <select
              id="sort-select"
              class="flex-1 px-4 py-2 text-sm border-2 border-slate-900 focus:border-blue-500 focus:outline-none md:flex-initial"
            >
              <option value="created-desc">Newest First</option>
              <option value="created-asc">Oldest First</option>
              <option value="endsAt-asc">Ending Soon</option>
              <option value="title-asc">Title (A-Z)</option>
              <option value="title-desc">Title (Z-A)</option>
            </select>

            <button
              id="clear-filters-btn"
              class="px-4 py-2 text-sm font-medium transition-colors whitespace-nowrap text-slate-600 hover:text-slate-900"
            >
              <i class="fa-solid fa-rotate-right"></i> Clear
            </button>
          </div>
        </div>

        <!-- Result Count -->
        <div class="mt-4">
          <p id="result-count" class="text-sm text-slate-600"></p>
        </div>
      </div>

      <!-- Listings Grid -->
      <div
        id="listings-grid"
        class="grid grid-cols-1 gap-6 md:grid-cols-2 lg:grid-cols-3"
      >
        <!-- Listing cards will be rendered here by JavaScript -->
      </div>
    </main>

    <!-- Footer (rendered by JavaScript) -->
    <div id="footer"></div>

    <!-- Import main script -->
    <script type="module" src="/src/pages/home.ts"></script>
  </body>
</html>
