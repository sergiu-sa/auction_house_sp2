[build]
  command = "npm run build"
  publish = "dist"

# Catch-all fallback so unknown URLs render the branded 404 page.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Optional: Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-XSS-Protection = "1; mode=block"

    # script-src has to keep 'unsafe-inline': every page loads its stylesheets with media="print" onload="this.media='all'", and CSP cannot allow an inline event handler by hash or nonce.
    # Drop it and the site renders with no icons and no display face.
    # So this policy is NOT an XSS backstop; object-src, base-uri, form-action, frame-ancestors and connect-src are what it actually buys. 
    # Escaping is the defence.
    #
    # style-src is the same story for 165 inline style="" attributes, which hashes do not cover either.
    #
    # img-src cannot be allowlisted at all: listing media are arbitrary user-supplied URLs.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self' https://v2.api.noroff.dev; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

    # Same policy, but with the script-src we actually want, reporting only.
    # Every violation it logs is an inline handler that has to go before the enforced policy above can drop 'unsafe-inline' from script-src.
    # Read them in the browser console on a deploy preview.
    #
    # style-src deliberately keeps 'unsafe-inline' here too.
    # Tightening it as well reports ~230 violations per page instead of 2;
    # — one for every inline style attribute, all of them known and none of them going anywhere;
    # — and an instrument nobody can read is an instrument nobody uses.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self' https://v2.api.noroff.dev; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
