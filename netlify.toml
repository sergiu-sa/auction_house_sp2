[build]
  command = "npm run build"
  publish = "dist"

# Catch-all fallback so unknown URLs render the branded 404 page.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Optional: Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    # X-XSS-Protection is deliberately absent: every current browser ignores it, and its
    # filtering mode was itself exploitable. Content-Security-Policy is what does this job.

    # script-src is 'self' with no escape hatch, which is the point of the whole exercise.
    # Reaching it took removing all 17 inline onload="this.media='all'" handlers: 8 with the icon font, 9 with these two display faces.
    # CSP cannot allow an inline event handler by hash or nonce, so while any remained this policy could not be an XSS backstop, only a set of narrower closures.
    # It now blocks inline script. Escaping is still the primary defence and this is the second line, not a replacement for it.
    #
    # Nothing is loaded from a third-party origin any more: the icon font, both display faces, every script and every stylesheet are same-origin.
    # The only cross-origin thing left is the API, in connect-src, and listing images, which cannot be allowlisted because they are arbitrary user-supplied URLs (F-022).
    #
    # style-src keeps 'unsafe-inline' for 163 inline style="" attributes, which hashes do not cover — that is style-src-attr, and removing them would change pixels for no gain the escaping layer does not already provide.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; connect-src 'self' https://v2.api.noroff.dev; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

    # The report-only policy is gone: it existed to count the inline handlers standing between us and script-src 'self', and that count is now zero.
    # Reintroduce one only to stage a specific tightening — style-src is the obvious candidate — and delete it again once that lands.

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Without this, every woff2 matches no rule above and falls through to /*, which sets no Cache-Control at all —
# Netlify then revalidates on every navigation, undoing most of the point of self-hosting them.
#
# Two kinds of file land here and only one is immutable by construction.
# src/styles/fonts/aucto-icons.woff2 is generated and content-hashed by Vite, so a new subset gets a new URL.
# public/fonts/*.woff2 are vendored releases under stable names: re-vendoring one under the same name serves the stale face for up to a year.
# If you replace one, change its filename.
[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
