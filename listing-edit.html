<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Edit Listing - Manage Your Auction | Aucto</title>
    <meta name="title" content="Edit Listing - Manage Your Auction | Aucto" />
    <meta name="description" content="Edit your auction listing details, update images, modify description, or delete your listing." />
    <meta name="keywords" content="edit listing, manage auction, update listing, delete listing" />
    <meta name="author" content="Aucto" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://auctohouse.netlify.app/listing-edit.html" />

    <!-- Additional SEO -->
    <meta name="theme-color" content="#1e293b" />

    <!-- Tailwind CSS -->
    <link rel="preload" href="/src/styles/main.css" as="style" />
    <link rel="stylesheet" href="/src/styles/main.css" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/images/icon_only_v2.svg" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body class="antialiased bg-aucto-bg" data-page-type="user-content">
    <!-- Skip Navigation Link -->
    <a href="#main-content" class="absolute -top-10 left-0 z-[100] bg-slate-900 text-white px-4 py-2 text-sm font-bold no-underline focus:top-0 focus:outline focus:outline-[3px] focus:outline-aucto-red focus:outline-offset-2" style="border: 3px solid #1e293b">Skip to main content</a>

    <!-- Header (rendered by JavaScript) -->
    <div id="header"></div>

    <!-- Main Content -->
    <main id="main-content">
      <section class="mx-auto max-w-7xl px-6 md:px-8 py-14">
        <!-- Breadcrumbs (rendered by JavaScript) -->
        <div id="breadcrumb-nav" class="mb-6"></div>

        <!-- Edit Listing Content (rendered by JavaScript) -->
        <div id="edit-listing-content" style="min-height: 600px;">
          <!-- Loading state -->
          <div class="flex items-center justify-center py-20">
            <div class="text-center">
              <i class="fa-solid fa-spinner fa-spin text-4xl text-slate-400 mb-4"></i>
              <p class="text-slate-600">Loading listing...</p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer (rendered by JavaScript) -->
    <div id="footer"></div>

    <!-- Delete Confirmation Modal -->
    <div
      id="deleteModal"
      class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 px-4"
    >
      <div
        class="bg-white p-8 max-w-md w-full"
        style="border: 3px solid #1e293b"
      >
        <div class="flex items-center gap-3 mb-6">
          <i class="fa-solid fa-triangle-exclamation text-3xl text-red-600"></i>
          <h2 class="text-2xl font-bold text-slate-900">Confirm Deletion</h2>
        </div>

        <p class="text-slate-700 mb-6">
          Are you absolutely sure you want to delete this listing? This action
          is permanent and cannot be undone.
        </p>

        <div class="bg-red-50 border-2 border-red-300 p-4 mb-6">
          <p class="text-sm text-red-800">
            <strong>This will:</strong><br />
            • Remove the listing permanently<br />
            • Cancel all active bids<br />
            • Cannot be recovered
          </p>
        </div>

        <div class="flex gap-4">
          <button
            id="cancelDelete"
            class="flex-1 bg-white text-slate-900 py-3 font-bold tracking-[0.18em] uppercase border-2 border-slate-900 hover:bg-slate-50 transition-colors"
          >
            Cancel
          </button>
          <button
            id="confirmDelete"
            class="flex-1 bg-red-700 text-white py-3 font-bold tracking-[0.18em] uppercase border-2 border-red-700 hover:bg-red-800 transition-colors"
          >
            Delete Forever
          </button>
        </div>
      </div>
    </div>

    <!-- Import main script -->
    <script type="module" src="/src/pages/listingEdit.ts"></script>
  </body>
</html>
