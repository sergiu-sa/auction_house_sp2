<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Edit Listing - Manage Your Auction | Aucto</title>
    <meta name="title" content="Edit Listing - Manage Your Auction | Aucto" />
    <meta
      name="description"
      content="Edit your auction listing details, update images, modify description, or delete your listing."
    />
    <meta
      name="keywords"
      content="edit listing, manage auction, update listing, delete listing"
    />
    <meta name="author" content="Aucto" />
    <meta name="robots" content="noindex, follow" />
    <link
      rel="canonical"
      href="https://auctohouse.netlify.app/listing-edit.html"
    />

    <!-- Additional SEO -->
    <meta name="theme-color" content="#1e293b" />

    <!-- Tailwind CSS -->
    <link rel="preload" href="/src/styles/main.css" as="style" />
    <link rel="stylesheet" href="/src/styles/main.css" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/images/icon_only_v2.svg" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cormorant:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Cormorant:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body class="bg-aucto-bg antialiased" data-page-type="user-content">
    <!-- Skip Navigation Link -->
    <a
      href="#main-content"
      class="absolute -top-10 left-0 z-[100] bg-slate-900 px-4 py-2 text-sm font-bold text-white no-underline focus:top-0 focus:outline focus:outline-[3px] focus:outline-offset-2 focus:outline-aucto-red"
      style="border: 3px solid var(--aucto-border-dark)"
      >Skip to main content</a
    >

    <!-- Header (rendered by JavaScript) -->
    <header id="header"></header>

    <!-- Main Content -->
    <main id="main-content" tabindex="-1">
      <section class="mx-auto max-w-7xl px-6 py-14 md:px-8">
        <!-- Breadcrumbs (rendered by JavaScript) -->
        <div id="breadcrumb-nav" class="mb-6"></div>

        <!-- Edit Listing Content (rendered by JavaScript) -->
        <div id="edit-listing-content" style="min-height: 600px">
          <!-- Loading state -->
          <div class="flex items-center justify-center py-20">
            <div class="text-center">
              <i
                class="fa-solid fa-spinner fa-spin mb-4 text-4xl text-slate-400"
                aria-hidden="true"
              ></i>
              <p class="text-slate-600">Loading listing...</p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer (rendered by JavaScript) -->
    <div id="footer"></div>

    <!-- Delete Confirmation Modal -->
    <div
      id="deleteModal"
      class="fixed inset-0 z-50 hidden items-center justify-center bg-black bg-opacity-50 px-4"
      role="dialog"
      aria-modal="true"
      aria-labelledby="deleteModalTitle"
      aria-describedby="deleteModalDescription"
    >
      <div
        class="w-full max-w-md bg-white p-8"
        style="border: 3px solid var(--aucto-border-dark)"
      >
        <div class="mb-6 flex items-center gap-3">
          <i
            class="fa-solid fa-triangle-exclamation text-3xl text-red-600"
            aria-hidden="true"
          ></i>
          <h2 id="deleteModalTitle" class="text-2xl font-bold text-slate-900">
            Confirm Deletion
          </h2>
        </div>

        <p id="deleteModalDescription" class="mb-6 text-slate-700">
          Are you absolutely sure you want to delete this listing? This action
          is permanent and cannot be undone.
        </p>

        <div class="mb-6 border-2 border-red-300 bg-red-50 p-4">
          <p class="text-sm text-red-800">
            <strong>This will:</strong><br />
            • Remove the listing permanently<br />
            • Cancel all active bids<br />
            • Cannot be recovered
          </p>
        </div>

        <div class="flex gap-4">
          <button
            id="cancelDelete"
            class="flex-1 border-2 border-slate-900 bg-white py-3 font-bold uppercase tracking-[0.18em] text-slate-900 transition-colors hover:bg-slate-50"
          >
            Cancel
          </button>
          <button
            id="confirmDelete"
            class="flex-1 border-2 border-red-700 bg-red-700 py-3 font-bold uppercase tracking-[0.18em] text-white transition-colors hover:bg-red-800"
          >
            Delete Forever
          </button>
        </div>
      </div>
    </div>

    <!-- Import main script -->
    <script type="module" src="/src/pages/ListingEdit.ts"></script>
  </body>
</html>
