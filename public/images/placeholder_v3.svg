<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="No image available" preserveAspectRatio="xMidYMid slice">
  <!--
    `slice` crops this square to the host box, so a mark must sit inside two bands, not one:
    y 229-371 from the widest box (hero main tile, 4.23:1) and x 162-438 from the narrowest(hero side tile, 0.46:1, taller than wide).
    Both measured; tests/placeholderGeometry.ts holds them.

    The dot pitch scales with the box, 2.5px to 37.4px across the boxes in use.
    26 is a floor for the cards: 16 and 11 were drawn and read as speckle there.

    The label is #5a6a80 to clear 4.5:1.
    Axe cannot see inside an <img>, so only tests/placeholder.test.ts catches a regression here.

    No border - every host box draws one.

    Stack, weight and tracking copied from logo_v2.svg so the two match.
    'Source Sans 3' never resolves here - an SVG in <img src> cannot reach @font-face - so both files
    draw in system-ui and match on the fallback. Do not point this at a vendored woff2; it cannot reach it.
  -->  <defs>
    <pattern id="dots" patternUnits="userSpaceOnUse" width="26" height="26">
      <circle cx="13" cy="13" r="2.6" fill="#cbd5e1"/>
    </pattern>
  </defs>
  <rect width="600" height="600" fill="#F7F7F5"/>
  <rect width="600" height="600" fill="url(#dots)"/>
  <rect x="176" y="254" width="248" height="110" fill="#F7F7F5"/>

  <!-- Wordmark -->
  <text
  x="300" y="316"
  text-anchor="middle"
  font-family="'Source Sans 3', system-ui, -apple-system, BlinkMacSystemFont, sans-serif"
  font-size="42"
  font-weight="800"
  letter-spacing="-0.04em"
  fill="#1e293b"
  >
  AUCTO
  </text>

  <text
  x="300" y="356"
  text-anchor="middle"
  font-family="sans-serif"
  font-size="11"
  font-weight="700"
  letter-spacing="5"
  fill="#5a6a80"
  >
  NO IMAGE
  </text>
</svg>
