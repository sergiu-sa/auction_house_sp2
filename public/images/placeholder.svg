<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="No image available" preserveAspectRatio="xMidYMid slice">
  <!--
    Every mark sits inside y 235-370 of the 600-unit square.
    `slice` crops this to the host box, and the widest box in use is the home hero's main tile at
    about 3:1, which shows only the middle third. Content outside that band is invisible there:
    the frame this used to draw rendered as two disconnected vertical lines in four of the seven
    card boxes, and the wordmark was cropped off the hero entirely.

    No border of its own. Every box that hosts this already draws one, so a second frame inside it
    read as an error state rather than a card face.

    The fonts are generic on purpose. An SVG referenced through <img src> is an isolated document
    and cannot reach the page's @font-face rules, so naming Cormorant and Source Sans 3 here only
    ever described a face the file could not load.
  -->
  <rect width="600" height="600" fill="#F7F7F5"/>
  <g transform="translate(300 268) scale(0.62)" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="square">
    <rect x="-72" y="-50" width="144" height="100"/>
    <circle cx="-30" cy="-18" r="10"/>
    <path d="M -72 28 L -22 -10 L 14 18 L 50 -10 L 72 12 L 72 50 L -72 50 Z" fill="#334155" fill-opacity="0.15"/>
  </g>
  <text x="300" y="332" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#475569">NO IMAGE</text>
  <text x="300" y="362" text-anchor="middle" font-family="serif" font-size="22" font-weight="600" font-style="italic" fill="#1e293b">Aucto</text>
</svg>
